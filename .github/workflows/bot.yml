name: Bot Wall Street 24/7
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python bot_check.py
        env:
          CORREO_DESTINO: ${{ secrets.CORREO_DESTINO }}
          GMAIL_REMITENTE: ${{ secrets.GMAIL_REMITENTE }}
          GMAIL_CLAVE_APP: ${{ secrets.GMAIL_CLAVE_APP }}
          TICKERS: ${{ secrets.TICKERS }}
          ALERTAS: ${{ secrets.ALERTAS }}
