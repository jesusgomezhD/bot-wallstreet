services:
  - type: web
    name: bot-wallstreet
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot_server.py
    healthCheckPath: /
    envVars:
      - key: GMAIL_REMITENTE
        sync: false
      - key: GMAIL_CLAVE_APP
        sync: false
      - key: GH_TOKEN
        sync: false
      - key: FINNHUB_KEY
        sync: false
